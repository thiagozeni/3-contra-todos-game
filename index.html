    <script>
      (function () {
        var isNative = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
        if (isNative) return;
        var s = document.createElement('script');
        s.async = true;

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        min-height: 100dvh;
        background: #000;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game-wrap {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      #game-wrap .dom-video-bg {
        position: absolute;
        z-index: 0;
        display: block;
        object-fit: cover;
        pointer-events: none;
        opacity: 0;
        background: #000;
        transition: opacity 160ms linear;
      }
      #game-wrap .dom-video-bg.is-ready {
        opacity: 1;
      }
      #game-wrap canvas {
        display: block;
        position: relative;
        z-index: 2;
      }
      /* Arena v2 (responsiva, cover revela torcida nas laterais). O GameScene liga/desliga.
         #arena-bg = vídeo de fundo + ringue (atrás do canvas). #arena-front = cordas da frente
         (na frente do canvas, lutadores ficam atrás). */
      #arena-bg, #arena-front {
        position: fixed;
        inset: 0;
        display: none;
        pointer-events: none;
      }
      #arena-bg {
        z-index: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        background: #05060a;
      }
      #arena-front {
        z-index: 3;
        background: transparent center center / cover no-repeat;
      }
      /* Fundo das telas de menu (Home, Select, etc.) — master superwide com cover
         responsivo (revela laterais em telas largas). pixelated preserva o pixel art. */
      #scene-bg, #intro-bg-video, #scene-bg-video {
        position: fixed;
        inset: 0;
        display: none;
        pointer-events: none;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        background: #05060a;
        image-rendering: pixelated;
      }
      /* #intro-bg-video herda z-index:0 (atrás do canvas, como #scene-bg). Por vir
         DEPOIS do #scene-bg no DOM, o vídeo pinta sobre o PNG de fallback. */
      #rotate-msg {
        display: none !important;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        color: #fff;
        font-size: 22px;
        font-family: monospace;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
      }
      @media (orientation: portrait) {
        #rotate-msg { display: flex !important; }
      }
    </style>
  </head>
  <body>
    <div id="loader-overlay" style="
      position: fixed; inset: 0; z-index: 999;
      background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      transition: opacity 0.5s ease;
    ">
      <!-- Arte do loader (tela de carregamento do Thiago, UI embutida removida) -->
      <img id="loader-art" src="imgs/cenario/loader-screen-clean.png" alt="" style="
        max-width: 72%; max-height: 64%; object-fit: contain; image-rendering: pixelated;
      ">

      <!-- Área fixa abaixo da arte — CARREGANDO/barra e botão ocupam o mesmo espaço -->
      <div style="width: 48%; min-width: 320px; position: relative; display: flex; align-items: center; justify-content: center; min-height: 84px;">

        <!-- Estado: carregando (CARREGANDO + barra rosa segmentada) -->
        <div id="loader-progress" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px;">
          <div style="
            font-family: 'Press Start 2P', monospace; font-size: clamp(14px, 2vw, 24px);
            color: #5ad6ff; letter-spacing: 6px;
            text-shadow: 0 0 12px #2bb8ff, 0 0 30px #1a8cff;
          ">CARREGANDO</div>
          <div style="
            width: 100%; height: 18px;
            background: rgba(255, 45, 168, 0.10);
            border: 2px solid rgba(255, 45, 168, 0.45);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 45, 168, 0.25);
            overflow: hidden;
          ">
            <div id="loader-bar" style="
              width: 0%; height: 100%;
              background: repeating-linear-gradient(90deg, #ff3db0 0 16px, rgba(0,0,0,0.4) 16px 20px);
              box-shadow: 0 0 12px #ff3db0, 0 0 26px #ff1a8c;
              transition: width 0.15s ease;
            "></div>
          </div>
          <div id="loader-pct" style="
            font-family: monospace; font-size: 13px;
            color: rgba(255, 140, 210, 0.9); letter-spacing: 2px;
            text-shadow: 0 0 8px #ff3db0;
          ">0%</div>
        </div>

        <!-- Estado: pronto (JOGAR) — aparece após 100%, mesmo espaço -->
        <div id="loader-play" style="
          position: absolute; inset: 0;
          display: none; align-items: center; justify-content: center;
          cursor: pointer;
        ">
          <div style="
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(20px, 3.2vw, 40px);
            color: #5ad6ff;
            text-shadow: 0 0 16px #2bb8ff, 0 0 40px #1a8cff, 0 0 80px #0a66cc;
            letter-spacing: 6px;
            animation: neon-pulse 1.2s ease-in-out infinite alternate;
          ">JOGAR</div>
        </div>

      </div>
    </div>

    <style>
      @keyframes neon-pulse {
        from { text-shadow: 0 0 10px #2bb8ff, 0 0 30px #1a8cff, 0 0 60px #0a66cc; }
        to   { text-shadow: 0 0 20px #5ad6ff, 0 0 50px #2bb8ff, 0 0 100px #1a8cff; }
      }
    </style>
    <img id="scene-bg" alt="" />
    <video id="intro-bg-video" muted loop playsinline preload="auto" poster="imgs/cenario/intro-bg.png"></video>
    <!-- Fundo de loop das telas de menu (How to Play / Select / Game Over). Sobre o
         #scene-bg (PNG fallback); ligado por mountSceneBgVideo, escondido no shutdown. -->
    <video id="scene-bg-video" muted loop playsinline preload="auto"></video>
    <video id="arena-bg" muted loop playsinline preload="auto" poster="imgs/cenario/arena-bg.png"></video>
    <div id="game-wrap"></div>
    <div id="arena-front"></div>
    <div id="rotate-msg">
      <div style="font-size:48px">&#8635;</div>
      <p>Gire o dispositivo<br>para jogar</p>
    </div>
    <script>
      // Chamado pelo BootScene quando o carregamento termina
      window.showPlayButton = function(onStart) {
        var progress = document.getElementById('loader-progress')
        var playBtn  = document.getElementById('loader-play')
        var overlay  = document.getElementById('loader-overlay')

        if (progress) progress.style.display = 'none'
        if (playBtn)  playBtn.style.display = 'flex'

        // touch-action: manipulation elimina o delay de 300ms no click mobile
        overlay.style.touchAction = 'manipulation'

        function start() {
          overlay.removeEventListener('pointerdown', start)
          overlay.removeEventListener('mousedown', start)
          overlay.removeEventListener('touchstart', start)
          overlay.removeEventListener('click', start)
          document.removeEventListener('keydown', start)
          if (typeof window.__unlockGameAudio === 'function') {
            try { window.__unlockGameAudio() } catch (e) {}
          }

          function proceed() {
            overlay.style.opacity = '0'
            setTimeout(function() {
              overlay.remove()
              onStart()
              if (typeof window.__showIOSBanner === 'function') {
                setTimeout(window.__showIOSBanner, 3000)
              }
            }, 500)
          }

          function lockOrientation() {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function() {})
            }
          }

          var isCapacitor = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
          var isAndroid = /Android/i.test(navigator.userAgent)
          if (isAndroid && !isCapacitor) {
            try {
              var el = document.documentElement
              var fsPromise = el.requestFullscreen ? el.requestFullscreen()
                            : el.webkitRequestFullscreen ? el.webkitRequestFullscreen()
                            : null
              if (fsPromise && fsPromise.then) {
                fsPromise.then(lockOrientation).catch(function(){})
              }
            } catch(e) {}
          }
          proceed()
        }

        // Registra eventos reais de gesto para destravar áudio no WKWebView/macOS.
        overlay.addEventListener('pointerdown', start)
        overlay.addEventListener('mousedown', start)
        overlay.addEventListener('touchstart', start)
        overlay.addEventListener('click', start)
        document.addEventListener('keydown', start)
      }
    </script>
    <script type="module" src="/src/main.ts"></script>

    <!-- Banner iOS: aparece só no Safari (não standalone) -->
    <div id="ios-banner" style="
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10000;
      background: rgba(0,0,0,0.92);
      border-top: 1px solid rgba(255,255,255,0.15);
      padding: 14px 20px 20px;
      font-family: -apple-system, sans-serif;
      color: #fff;
      text-align: center;
    ">
      <div style="font-size:13px; line-height:1.6; margin-bottom:10px;">
        Para jogar em tela cheia, adicione à tela inicial:<br>
        toque em <strong>&#9633; Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong>
      </div>
      <button onclick="document.getElementById('ios-banner').style.display='none'" style="
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 8px;
        color: #fff;
        font-size: 12px;
        padding: 6px 18px;
        cursor: pointer;
      ">Fechar</button>
    </div>
    <script>
      (function() {
        var isCapacitor = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
        if (isCapacitor) return // Dentro do app nativo, nunca mostra banner PWA
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
        var isStandalone = window.navigator.standalone === true
        if (isIOS && !isStandalone) {
          // Mostra o banner só depois que o jogo iniciar (aguarda o overlay sumir)
          window.__showIOSBanner = function() {
            var banner = document.getElementById('ios-banner')
            if (banner) banner.style.display = 'block'
          }
        }
      })()
    </script>
  </body>
