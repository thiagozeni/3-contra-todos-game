<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>HUD piloto — direção B (arcade premium)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ── tokens (direção B) ── */
    --gold:#f3c204; --gold-deep:#c9a84c;
    --danger:#ff4d4d; --warn:#ffaa22; --ok:#22cc44;
    --p1:#3b9eff; --p2:#ff4fd8; --p3:#52e85c;
    --night:#0d0d1a; --ink:#000;
    --txt-hi:#fff; --txt-mid:#cccccc;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
  .stage{position:relative;width:1920px;height:1080px;
    background:url('file:///Users/pro15/Claude/3-contra-todos/game-v2/public/imgs/cenario/game-bg.png') center/cover no-repeat;
    font-family:"Press Start 2P",monospace}
  /* leve vinheta + scanline CRT sutis (assinatura da direção B) */
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px);
    mix-blend-mode:multiply;opacity:.45}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 35%,transparent 55%,rgba(0,0,0,.55) 100%)}

  /* ── painel premium reutilizável (moldura chanfrada + filete dourado + glow) ── */
  .panel{position:absolute;background:rgba(13,13,26,.82);
    border:3px solid var(--gold);
    box-shadow:0 0 0 2px rgba(0,0,0,.9), 0 0 18px rgba(243,194,4,.35), inset 0 0 22px rgba(0,0,0,.6);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}

  /* ── bloco do player (P1) ── */
  .player{left:38px;top:34px;width:560px;height:150px;display:flex;gap:16px;padding:14px}
  .portrait{width:122px;height:122px;flex:0 0 122px;position:relative;
    border:2px solid var(--gold-deep);background:#12163a;overflow:hidden}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:top center;image-rendering:pixelated}
  .pinfo{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
  .pname{font-size:22px;color:var(--p1);
    text-shadow:3px 3px 0 var(--ink),0 0 10px rgba(59,158,255,.5)}
  .ptag{font-size:11px;color:var(--gold);vertical-align:super;margin-left:8px}
  /* barra de HP arcade: trilho + fill com brilho glossy + filete */
  .hp{position:relative;height:34px;background:#1a1a22;border:2px solid #000;
    box-shadow:inset 0 0 0 2px #3a3a46}
  .hp>i{display:block;height:100%;width:86%;
    background:linear-gradient(180deg,#5cff8a 0%,var(--ok) 45%,#138a2e 100%);
    box-shadow:inset 0 6px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.3)}

  /* ── centro: wave + score + inimigos ── */
  .center{left:50%;top:30px;transform:translateX(-50%);width:520px;height:120px;
    padding:14px 22px;text-align:center}
  .wave{font-size:26px;color:var(--gold);letter-spacing:1px;
    text-shadow:3px 3px 0 var(--ink),0 0 14px rgba(243,194,4,.6)}
  .score{margin-top:14px;font-size:18px;color:var(--txt-hi);text-shadow:2px 2px 0 var(--ink)}
  .score b{color:var(--gold)}
  .enemies{margin-top:12px;font-size:13px;color:var(--danger);text-shadow:2px 2px 0 var(--ink)}

  /* ── aliado (FB9/10) — linha compacta abaixo do player ── */
  .ally{left:38px;top:200px;width:430px;height:78px;display:flex;gap:12px;padding:10px}
  .ally .portrait{width:58px;height:58px;flex:0 0 58px}
  .ally .pname{font-size:15px;color:var(--p2);text-shadow:2px 2px 0 var(--ink)}
  .ally .hp{height:20px}.ally .hp>i{width:64%;
    background:linear-gradient(180deg,#ffd36a,var(--warn) 60%,#a85f00)}
  .badge{position:absolute;right:-8px;top:50%;transform:translateY(-50%);
    font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:5px 7px;border:2px solid var(--gold)}

  /* ── combo (assinatura premium, canto dir) ── */
  .combo{position:absolute;right:80px;top:220px;text-align:right;overflow:visible}
  .combo .n{font-size:54px;color:var(--gold);font-family:"Chakra Petch";font-weight:700;
    text-shadow:4px 4px 0 var(--ink),0 0 18px rgba(243,194,4,.7);font-style:italic}
  .combo .l{font-size:14px;color:var(--txt-hi);text-shadow:2px 2px 0 var(--ink);margin-top:-4px}

  .tag{position:absolute;left:20px;bottom:16px;font-family:"Chakra Petch";font-weight:600;
    font-size:18px;color:rgba(255,255,255,.55);letter-spacing:2px}
</style>
</head>
<body>
  <div class="stage">
    <!-- PLAYER P1 -->
    <div class="panel player">
      <div class="portrait"><img src="file:///Users/pro15/Claude/3-contra-todos/game-v2/public/imgs/personagens/hud-werdum.png"></div>
      <div class="pinfo">
        <div class="pname">WERDUM<span class="ptag">P1</span></div>
        <div class="hp"><i></i></div>
      </div>
    </div>

    <!-- CENTER: wave / score / enemies -->
    <div class="panel center">
      <div class="wave">WAVE 3 / 12</div>
      <div class="score">SCORE <b>012450</b></div>
      <div class="enemies">◆ 6 INIMIGOS</div>
    </div>

    <!-- ALLY (P2) -->
    <div class="panel ally">
      <div class="portrait"><img src="file:///Users/pro15/Claude/3-contra-todos/game-v2/public/imgs/personagens/hud-dida.png"></div>
      <div class="pinfo">
        <div class="pname">DIDA</div>
        <div class="hp"><i></i></div>
      </div>
    </div>

    <!-- COMBO -->
    <div class="combo">
      <div class="n">12×</div>
      <div class="l">COMBO</div>
    </div>

    <div class="tag">MOCKUP · DIREÇÃO B · ARCADE PREMIUM</div>
  </div>
</body>
</html>
