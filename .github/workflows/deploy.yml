name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── Site principal (main → / e /demo) ───────────────────────────────────
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # ── Preview v2 (branch v2 → /v2) — aditivo, nao pode quebrar o deploy ────
      - uses: actions/checkout@v4
        with:
          ref: v2
          path: v2-src
      - name: Build v2 preview into dist/v2
        continue-on-error: true
        working-directory: v2-src
        run: |
          npm install --no-audit --no-fund
          VITE_FREE_BUILD=true VITE_NET_ENABLED=true VITE_SERVER_URL=wss://coop.werdumfight.com \
            npx vite build --outDir "$GITHUB_WORKSPACE/dist/v2" --emptyOutDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
